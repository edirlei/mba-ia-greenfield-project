services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_healthy
      redis:
        condition: service_healthy

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - .:/home/node/app
      - video-worker-temp:/tmp/streamtube-videos
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "pgrep -f 'src/video-worker.ts' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - '${REDIS_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${STORAGE_ACCESS_KEY:-streamtube}'
      MINIO_ROOT_PASSWORD: '${STORAGE_SECRET_KEY:-streamtube-secret}'
      MINIO_API_CORS_ALLOW_ORIGIN: '${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:3001}'
      MINIO_API_STALE_UPLOADS_EXPIRY: '${MINIO_STALE_UPLOADS_EXPIRY:-24h}'
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: '${MINIO_STALE_UPLOADS_CLEANUP_INTERVAL:-1h}'
    ports:
      - '${MINIO_PUBLISHED_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PUBLISHED_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: '${STORAGE_ACCESS_KEY:-streamtube}'
      MINIO_ROOT_PASSWORD: '${STORAGE_SECRET_KEY:-streamtube-secret}'
      STORAGE_BUCKET: '${STORAGE_BUCKET:-streamtube}'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
        mc anonymous set none "local/$${STORAGE_BUCKET}"
        touch /tmp/ready
        tail -f /dev/null
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/ready']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
  minio-data:
  video-worker-temp:
